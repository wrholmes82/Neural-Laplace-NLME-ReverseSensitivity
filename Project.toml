name = "NLMEReverse"
uuid = "3f2c9a41-7e05-4d6b-9a3e-5c1d8b70e211"
version = "0.2.0"

# Problem-agnostic NLME infrastructure: Laplace/FOCE objective, inner mode solve, the
# adjoint and forward-sensitivity gradients, and the reverse population gradient that is
# O(1) in p.  The reverse-mode ENGINES are deliberately not dependencies: each is loaded
# at run time from src/backends/, so an engine that will not precompile on a given machine
# cannot stop this package loading.  Add whichever engines you want to the ENVIRONMENT you
# run in (Local_Env), not here.
[deps]
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
LineSearches = "d3d80556-e9d4-5f37-9878-2ab0fcc64255"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Optim = "429524aa-4258-5aef-a3af-852621145aeb"
Optimization = "7f7a1694-90dd-40f0-9382-eb1efda571ba"
OptimizationOptimJL = "36348300-93cb-4f02-beb5-3c3902f8871e"

[compat]
julia = "1.11"
